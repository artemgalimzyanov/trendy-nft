name: Daily Trendy run

on:
  schedule:
    - cron: "0 18 * * *"   # 18:00 UTC every day
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no paid API calls, gallery untouched)"
        type: boolean
        default: false

permissions:
  contents: write   # needed to commit docs/gallery.json

concurrency:
  group: trendy-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python main.py run --dry-run
          else
            python main.py run
          fi

      - name: Commit gallery.json
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/gallery.json
          if git diff --cached --quiet; then
            echo "gallery.json unchanged"
          else
            git commit -m "gallery: add $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: trendy-output
          path: output/
